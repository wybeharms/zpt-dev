  <path d="M300 30 L248 158 L352 158 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linejoin="round"></path>

  
  <polygon points="20,47 305,93.8 305,96.2 20,53" fill="#B8B8C8" opacity="0.7"></polygon>
