<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZPT — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 30px; background: var(--zpt-navy); font-family: var(--font-body); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  /* Shared baseline — all buttons are the same height, same vertical rhythm */
  .btn {
    box-sizing: border-box;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: var(--font-logo);
    font-weight: 500;
    font-size: 14px;
    line-height: 1;
    letter-spacing: 0.02em;
    border-radius: 4px;
    border: 1px solid transparent; /* reserve 2px so borderless variants match bordered ones */
    cursor: pointer;
    padding: 0 24px;
    white-space: nowrap;
  }

  .p { background: var(--zpt-gold); color: var(--zpt-navy); padding: 0 32px; }
  .p:hover { background: var(--zpt-gold-light); }

  .g { background: transparent; color: rgba(255,255,255,0.8); border-color: rgba(255,255,255,0.2); }
  .g:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

  .l { color: var(--zpt-navy); background: transparent; text-decoration: underline; text-underline-offset: 4px; padding: 0 8px; }

  .on-light { background: var(--zpt-off-white); padding: 12px; border-radius: 8px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
<button class="btn p">Book a Call</button>
<button class="btn g">
  <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
  One-Pager PDF
</button>
<div class="on-light"><button class="btn l">See the full process →</button></div>
</body>
</html>
