<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZPT — Type: Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-1); font-family: var(--font-body); }
  .spec { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
  .lhs h1 { font-family: var(--font-heading); font-weight: 300; font-size: 56px; line-height: 1.05; letter-spacing: -0.01em; color: var(--zpt-navy); margin: 0; }
  .lhs h1 em { color: var(--zpt-gold); font-style: italic; }
  .meta { font-family: var(--font-logo); font-size: 10px; color: var(--fg-3); text-align: right; line-height: 1.5; white-space: nowrap; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="spec">
  <div class="lhs"><h1>Turn AI into <em>a co-worker</em>.</h1></div>
  <div class="meta">Cormorant Garamond · 300<br>56 / 59 · -0.01em<br>clamp(36→56px)</div>
</div>
</body>
</html>
