<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZPT — Partner Logos</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px; background: var(--bg-1); font-family: var(--font-body); }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .tile { width: 56px; height: 56px; border: 1px solid var(--zpt-border-warm); background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 10px; box-shadow: var(--shadow-sm); }
  .tile img { max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
</head>
<body>
<div class="grid">
  <div class="tile"><img src="../assets/logos/claude.png" alt=""></div>
  <div class="tile"><img src="../assets/logos/openai.png" alt=""></div>
  <div class="tile"><img src="../assets/logos/hubspot.png" alt=""></div>
  <div class="tile"><img src="../assets/logos/salesforce.png" alt=""></div>
  <div class="tile"><img src="../assets/logos/google-drive.png" alt=""></div>
  <div class="tile"><img src="../assets/logos/excel.png" alt=""></div>
  <div class="tile"><img src="../assets/logos/powerpoint.png" alt=""></div>
  <div class="tile"><img src="../assets/logos/notion.png" alt=""></div>
  <div class="tile"><img src="../assets/logos/slack.png" alt=""></div>
  <div class="tile"><img src="../assets/logos/sharepoint.png" alt=""></div>
  <div class="tile"><img src="../assets/logos/google_maps.png" alt=""></div>
  <div class="tile"><img src="../assets/logos/linkedin.svg" alt=""></div>
</div>
</body>
</html>
