<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZPT — Spacing & Radius</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-1); font-family: var(--font-body); color: var(--zpt-navy); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  h4 { font-family: var(--font-logo); font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--fg-3); margin: 0 0 10px; font-weight: 500; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 11px; font-family: var(--font-logo); color: var(--fg-3); }
  .bar { background: var(--zpt-gold); height: 8px; border-radius: 2px; }
  .shape { background: var(--zpt-navy); width: 40px; height: 30px; }
  .rrow { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; font-size: 11px; font-family: var(--font-logo); color: var(--fg-3); }
</style>
</head>
<body>
<div class="grid">
  <div>
    <h4>Spacing (px)</h4>
    <div class="row"><div class="bar" style="width:4px"></div><span>4 · space-1</span></div>
    <div class="row"><div class="bar" style="width:8px"></div><span>8 · space-2</span></div>
    <div class="row"><div class="bar" style="width:16px"></div><span>16 · space-4</span></div>
    <div class="row"><div class="bar" style="width:32px"></div><span>32 · space-6</span></div>
    <div class="row"><div class="bar" style="width:64px"></div><span>64 · space-10</span></div>
    <div class="row"><div class="bar" style="width:96px"></div><span>96 · space-12 (py-24)</span></div>
  </div>
  <div>
    <h4>Radius</h4>
    <div class="rrow"><div class="shape" style="border-radius: 4px"></div><span>4 · sm — buttons</span></div>
    <div class="rrow"><div class="shape" style="border-radius: 6px"></div><span>6 · md — small chips</span></div>
    <div class="rrow"><div class="shape" style="border-radius: 8px"></div><span>8 · lg — cards</span></div>
    <div class="rrow"><div class="shape" style="border-radius: 12px"></div><span>12 · xl — feature cards</span></div>
    <div class="rrow"><div class="shape" style="border-radius: 9999px; width:30px"></div><span>full — avatars, steps</span></div>
  </div>
</div>
</body>
</html>
