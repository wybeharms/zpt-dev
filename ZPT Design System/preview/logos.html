<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZPT — Logos</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 0; background: var(--bg-1); font-family: var(--font-body); color: var(--zpt-navy); display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  .cell { padding: 22px 24px; display: flex; align-items: center; gap: 12px; }
  .light { background: var(--zpt-off-white); }
  .dark { background: var(--zpt-navy); color: #fff; }
  .name { display: flex; align-items: center; gap: 10px; font-family: var(--font-logo); font-size: 16px; font-weight: 500; letter-spacing: 0.02em; }
  .name img { height: 26px; width: 26px; }
  .caption { font-family: var(--font-logo); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); margin-left: auto; }
  .dark .caption { color: rgba(255,255,255,0.4); }
</style>
</head>
<body>
<div class="cell light">
  <span class="name"><img src="../assets/logo-icon.svg" alt=""> Zero Person Team</span>
  <span class="caption">Primary</span>
</div>
<div class="cell dark">
  <span class="name"><img src="../assets/favicon.png" alt=""> Zero Person Team</span>
  <span class="caption">On Navy</span>
</div>
</body>
</html>
