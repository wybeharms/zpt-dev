<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZPT — Type: Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-1); font-family: var(--font-body); color: var(--zpt-navy); }
  .row { display: flex; align-items: baseline; gap: 20px; padding: 6px 0; border-bottom: 1px solid var(--zpt-border-warm); }
  .row:last-child { border: 0; }
  .sample { flex: 1; }
  .meta { font-family: var(--font-logo); font-size: 10px; color: var(--fg-3); white-space: nowrap; letter-spacing: 0.02em; }
  h1 { font-family: var(--font-heading); font-weight: 300; font-size: 36px; line-height: 1.1; letter-spacing: -0.01em; margin: 0; }
  h2 { font-family: var(--font-heading); font-weight: 300; font-size: 28px; line-height: 1.15; letter-spacing: -0.01em; margin: 0; }
  h3 { font-family: var(--font-body); font-weight: 600; font-size: 18px; margin: 0; letter-spacing: -0.015em; }
  p.body { font-family: var(--font-body); font-size: 14px; color: var(--zpt-muted); margin: 0; letter-spacing: -0.005em; }
  p.sm { font-family: var(--font-body); font-size: 12px; color: var(--zpt-muted); margin: 0; letter-spacing: -0.005em; }
</style>
</head>
<body>
<div class="row"><div class="sample"><h1>How We Work</h1></div><div class="meta">Cormorant · 300 · 36/40</div></div>
<div class="row"><div class="sample"><h2>Good Fit If</h2></div><div class="meta">Cormorant · 300 · 28/32</div></div>
<div class="row"><div class="sample"><h3>Build the company setup</h3></div><div class="meta">Geist · 600 · 18/24</div></div>
<div class="row"><div class="sample"><p class="body">Configure Claude, ChatGPT, and get your team up and running.</p></div><div class="meta">Geist · 400 · 14/24</div></div>
<div class="row"><div class="sample"><p class="sm">Pricing on request.</p></div><div class="meta">Geist · 400 · 12/18</div></div>
</body>
</html>
