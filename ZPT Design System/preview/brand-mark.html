<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZPT — Brand Mark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--zpt-navy); color: #fff; font-family: var(--font-body); display: flex; align-items: center; justify-content: center; gap: 40px; padding: 30px; min-height: 200px; }
  .mark { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .mark img { width: 72px; height: 72px; }
  .lbl { font-family: var(--font-logo); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.5); }
  .tagline { font-family: var(--font-heading); font-weight: 300; font-style: italic; font-size: 20px; letter-spacing: -0.01em; line-height: 1.4; max-width: 280px; }
  .tagline em { color: var(--zpt-gold); }
</style>
</head>
<body>
  <div class="mark"><img src="../assets/favicon.svg" alt=""><span class="lbl">Prism · Navy Rounded</span></div>
  <div class="tagline">Turn AI into <em>a co-worker</em>, not a chatbot.</div>
</body>
</html>
