<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZPT — Colors: Navy Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-1); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .swatch { border: 1px solid var(--zpt-border-warm); border-radius: var(--radius-lg); overflow: hidden; background: #fff; }
  .chip { height: 80px; }
  .meta { padding: 10px 12px; }
  .name { display: block; font-family: var(--font-logo); font-size: 12px; color: var(--zpt-navy); font-weight: 500; }
  .hex { display: block; font-family: var(--font-logo); font-size: 10px; color: var(--fg-3); margin-top: 2px; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch">
    <div class="chip" style="background: var(--zpt-navy-deep);"></div>
    <div class="meta">
      <span class="name">navy-deep</span>
      <span class="hex">#05051A · shadows, footer base</span>
    </div>
  </div>
  <div class="swatch">
    <div class="chip" style="background: var(--zpt-navy);"></div>
    <div class="meta">
      <span class="name">navy</span>
      <span class="hex">#0C0C28 · brand ink, hero bg</span>
    </div>
  </div>
  <div class="swatch">
    <div class="chip" style="background: var(--zpt-navy-light);"></div>
    <div class="meta">
      <span class="name">navy-light</span>
      <span class="hex">#1A1A3F · elevated surface</span>
    </div>
  </div>
</div>
</body>
</html>
