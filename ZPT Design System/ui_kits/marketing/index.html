<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ZPT — Marketing UI Kit</title>
<link rel="icon" href="../../assets/favicon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Geist:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../../colors_and_type.css" />

<style>
  :root {
    --tw-color-navy: #0C0C28;
    --tw-color-navy-light: #161640;
    --tw-color-gold: #C9A96E;
    --tw-color-gold-light: #D4BA8A;
    --tw-color-gold-dark: #B58A4B;
    --tw-color-off-white: #FAFAF7;
    --tw-color-cream: #F5F4ED;
    --tw-color-sand: #EAE8DE;
    --tw-color-border-warm: #E7E2D4;
    --tw-color-text-primary: #0C0C28;
    --tw-color-text-muted: #64748B;
    --tw-color-slate-blue: #475B7A;
  }
  html, body { background: #FAFAF7; }
  body { font-family: 'Geist', system-ui, sans-serif; color: var(--tw-color-navy); }
  .font-heading { font-family: 'Cormorant Garamond', Georgia, serif; letter-spacing: -0.01em; }
  .font-logo { font-family: 'Source Code Pro', ui-monospace, monospace; }
  .font-mono { font-family: 'Source Code Pro', ui-monospace, monospace; }

  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .shimmer {
    background-image: linear-gradient(90deg, #C9A96E 0%, #D4BA8A 50%, #C9A96E 100%);
    background-size: 200% 100%;
    animation: shimmer 3s ease-in-out infinite;
  }
  .shimmer-stripe { animation: shimmer 3s ease-in-out infinite; }

  @keyframes quoteGlow {
    0%, 100% { color: #0C0C28; text-shadow: 0 0 0 rgba(201,169,110,0); }
    50% { color: #C9A96E; text-shadow: 0 0 12px rgba(201,169,110,0.35); }
  }
  .quote-glow { animation: quoteGlow 4s ease-in-out infinite; display: inline-block; }

  @keyframes breathe {
    0%, 100% { font-size: 1em; }
    50% { font-size: 1.15em; }
  }
  .breathe { animation: breathe 3s ease-in-out infinite; display: inline-block; }
</style>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: '#0C0C28', 'navy-light': '#161640',
          gold: '#C9A96E', 'gold-light': '#D4BA8A', 'gold-dark': '#B58A4B',
          'off-white': '#FAFAF7', cream: '#F5F4ED', sand: '#EAE8DE',
          'border-warm': '#E7E2D4',
          'text-primary': '#0C0C28', 'text-muted': '#64748B',
          'slate-blue': '#475B7A',
        },
        fontFamily: {
          heading: ['Cormorant Garamond', 'Georgia', 'serif'],
          logo: ['Source Code Pro', 'ui-monospace', 'monospace'],
          mono: ['Source Code Pro', 'ui-monospace', 'monospace'],
          sans: ['Geist', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="QuoteSection.jsx"></script>
<script type="text/babel" src="ProblemSection.jsx"></script>
<script type="text/babel" src="ProcessSection.jsx"></script>
<script type="text/babel" src="AgentDiagram.jsx"></script>
<script type="text/babel" src="ProofSection.jsx"></script>
<script type="text/babel" src="PricingSection.jsx"></script>
<script type="text/babel" src="CtaSection.jsx"></script>

<script type="text/babel">
const App = () => {
  const [active, setActive] = React.useState("home");
  return (
    <>
      <MktHeader active={active} onNav={setActive} />
      <main>
        <Hero />
        <QuoteSection />
        <ProblemSection />
        <ProcessSection />
        <AgentDiagram />
        <ProofSection />
        <PricingSection />
        <CtaSection />
      </main>
      <MktFooter />
    </>
  );
};
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
