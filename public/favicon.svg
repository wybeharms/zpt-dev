<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C55A"/>
      <stop offset="45%" stop-color="#D4A843"/>
      <stop offset="100%" stop-color="#B8892E"/>
    </linearGradient>
  </defs>
  <!-- Outer square: solid navy fill -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#0C0C28"/>
  <!-- White interior cutout -->
  <rect x="4" y="4" width="24" height="24" rx="4" fill="#FFFFFF"/>
  <!-- Gold diamond -->
  <rect x="9" y="9" width="14" height="14" rx="2" fill="none" stroke="url(#gold)" stroke-width="1.8" transform="rotate(45, 16, 16)"/>
  <!-- Inner square -->
  <rect x="12" y="12" width="8" height="8" rx="2" fill="#0C0C28"/>
  <circle cx="16" cy="16" r="1.5" fill="url(#gold)"/>
</svg>
